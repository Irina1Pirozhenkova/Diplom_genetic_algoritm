[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "program"
version = "0.1.0"
description = "CLI program for simulating ethnogenesis with a genetic algorithm."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[tool.setuptools]
packages = ["program"]
